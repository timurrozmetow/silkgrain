<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      A tab icon and nothing else. The panel is served under `/admin/`, so the paths carry that
      prefix; there is no manifest and no touch icon because nobody adds a back office to their
      home screen, and `noindex, nofollow` above already says what this page is for.
    -->
    <link rel="icon" href="/admin/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/admin/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0B3D2C" />

    <title>SilkGrain Admin</title>

    <!-- The storefront's boot mark, on the panel's own canvas. See apps/web/index.html. -->
    <style>
      #sg-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef1ec;
      }
      #sg-boot span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 7px;
        background: #0b3d2c;
        animation: sg-boot-pulse 1.4s ease-in-out infinite;
      }
      #sg-boot svg {
        width: 32px;
        height: 32px;
        fill: #d3a73b;
      }
      @keyframes sg-boot-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.72;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #sg-boot span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="sg-boot" role="status" aria-label="Loading the SilkGrain admin panel">
        <span>
          <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false">
            <path
              d="M208,56a87.52,87.52,0,0,0-31.84,6c-14.32-29.7-43.25-44.46-44.57-45.13a8,8,0,0,0-7.16,0C123.1,17.51,94.17,32.27,79.85,62A87.52,87.52,0,0,0,48,56a8,8,0,0,0-8,8v80a88.12,88.12,0,0,0,75.48,87.1,4,4,0,0,0,4.52-4V176.27a8.18,8.18,0,0,1,7.47-8.25,8,8,0,0,1,8.53,8v51.14a4,4,0,0,0,4.52,4A88.12,88.12,0,0,0,216,144V64A8,8,0,0,0,208,56Zm-88,93.46a88,88,0,0,0-64-37.09V72.44A72.1,72.1,0,0,1,120,144Zm8-42.1A88.61,88.61,0,0,0,94.16,69.11c9.21-19.21,26.4-31.33,33.84-35.9,7.45,4.58,24.63,16.7,33.84,35.9A88.61,88.61,0,0,0,128,107.36Zm72,5a88,88,0,0,0-64,37.09V144a72.1,72.1,0,0,1,64-71.56Z"
            />
          </svg>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
