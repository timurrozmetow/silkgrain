<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Premium Central Asian rice, lentils, dried fruit and spices, shipped fresh from Houston, TX."
    />

    <!--
      The brand mark, generated by `node scripts/make-icons.mjs` from the same tokens the header
      lockup uses (decision D-9). The `.ico` is first and the SVG second on purpose: a browser
      that understands both takes the later one, and one that understands neither still finds
      `/favicon.ico` where it always looks.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E6B4A" />

    <title>SilkGrain — Ancient Grains. Modern Table.</title>

    <!--
      What the page looks like before any JavaScript has run.

      `#root` used to be empty, so the first paint of a cold visit was a white rectangle for as
      long as it took to fetch and parse the bundle - on the shop's own one-core box, long enough
      to look broken. This is the mark on the shop's own parchment, inline so it costs no request
      and is painted with the document itself.

      It lives INSIDE `#root`, which is what removes it: `createRoot(...).render()` replaces that
      element's children, so there is no teardown to write and nothing to forget to remove. The
      colours are the tokens' literal values rather than variables because this stylesheet is
      parsed before the app's CSS exists.

      `prefers-reduced-motion` stops the pulse and leaves the mark, which is the point of the
      preference: something is still visibly there, it just is not moving.
    -->
    <style>
      #sg-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f0e8;
      }
      #sg-boot span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 7px;
        background: #0e6b4a;
        animation: sg-boot-pulse 1.4s ease-in-out infinite;
      }
      #sg-boot svg {
        width: 32px;
        height: 32px;
        fill: #f3f0e8;
      }
      @keyframes sg-boot-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.72;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #sg-boot span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="sg-boot" role="status" aria-label="Loading SilkGrain">
        <span>
          <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false">
            <path
              d="M208,56a87.52,87.52,0,0,0-31.84,6c-14.32-29.7-43.25-44.46-44.57-45.13a8,8,0,0,0-7.16,0C123.1,17.51,94.17,32.27,79.85,62A87.52,87.52,0,0,0,48,56a8,8,0,0,0-8,8v80a88.12,88.12,0,0,0,75.48,87.1,4,4,0,0,0,4.52-4V176.27a8.18,8.18,0,0,1,7.47-8.25,8,8,0,0,1,8.53,8v51.14a4,4,0,0,0,4.52,4A88.12,88.12,0,0,0,216,144V64A8,8,0,0,0,208,56Zm-88,93.46a88,88,0,0,0-64-37.09V72.44A72.1,72.1,0,0,1,120,144Zm8-42.1A88.61,88.61,0,0,0,94.16,69.11c9.21-19.21,26.4-31.33,33.84-35.9,7.45,4.58,24.63,16.7,33.84,35.9A88.61,88.61,0,0,0,128,107.36Zm72,5a88,88,0,0,0-64,37.09V144a72.1,72.1,0,0,1,64-71.56Z"
            />
          </svg>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
