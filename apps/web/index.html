<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Premium Central Asian rice, lentils, dried fruit and spices, shipped fresh from Houston, TX."
    />

    <!--
      The brand mark, generated by `node scripts/make-icons.mjs` from the same tokens the header
      lockup uses (decision D-9). The `.ico` is first and the SVG second on purpose: a browser
      that understands both takes the later one, and one that understands neither still finds
      `/favicon.ico` where it always looks.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E6B4A" />

    <title>SilkGrain — Ancient Grains. Modern Table.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
