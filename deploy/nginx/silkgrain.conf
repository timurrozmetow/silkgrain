# =========================================================================================
# SilkGrain - the Nginx site. Two static SPAs and one reverse proxy.
#
# WHERE THIS FILE GOES AND HOW TO ENABLE IT
#
#   sudo install -o root -g root -m 0644 \
#        /srv/silkgrain/current/deploy/nginx/silkgrain.conf \
#        /etc/nginx/sites-available/silkgrain.conf
#   sudo ln -sfn /etc/nginx/sites-available/silkgrain.conf /etc/nginx/sites-enabled/silkgrain.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Copy it (`install`), never symlink it into /srv/silkgrain/current. That symlink is repointed
# by every deploy, so a symlinked config would silently become a different file whenever a
# release lands - including on a rollback, which would quietly restore an older config that was
# never reloaded and never reviewed. The web server's configuration is not release state.
#
# Remove the distribution's `default` site. This file declares no `default_server`, so nothing
# here conflicts with it and `nginx -t` will pass either way; the problem is quieter than that.
# `default` owns `default_server` on :80 and :443, which means every request carrying a Host
# nobody configured - a scanner, a stale DNS record, the raw IP - is answered by the Ubuntu
# welcome page rather than by us. With `default` gone the first server block below takes those
# requests, which is the :80 redirect, and it redirects the caller to the host the caller itself
# asked for. If you later decide to add `default_server` to a `listen` line here, you MUST
# remove `default` first, or nginx refuses to start with "a duplicate default server".
#
# THE DOMAIN
#
# `silkgrain.com` is the real domain, answering question Q-11 (decision D-48), and it is written
# out here rather than left as a token. It appears only in `server_name` and in the certificate
# paths; the Content-Security-Policy names no host at all, because the product images are served
# from this same origin under /media/ (decision D-52). So a different domain is one substitution
# and nothing else needs checking afterwards:
#
#   sudo sed -i 's/silkgrain\.com/YOURDOMAIN.com/g' /etc/nginx/sites-available/silkgrain.conf
#
# The one thing that substitution does NOT reach is `S3_PUBLIC_URL` in /srv/silkgrain/shared/.env,
# which carries the same domain. The two must agree: a public URL on one host and a `/media/`
# block on another is not a visible error, it is a catalogue of blank rectangles and a console
# nobody is reading.
#
# CERTIFICATES: ORDER OF OPERATIONS
#
# Nginx refuses to start when `ssl_certificate` names a file that is not there, so the TLS
# server blocks below cannot be enabled before the certificate exists, and the certificate
# cannot be issued before Nginx answers the ACME challenge. Break the cycle in this order:
#
#   1. comment out the two `listen 443` server blocks and the `return 301` in the :80 block
#   2. sudo mkdir -p /var/www/certbot && sudo chown -R www-data:www-data /var/www/certbot
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot certonly --webroot -w /var/www/certbot \
#           -d silkgrain.com -d www.silkgrain.com
#   5. restore this file and reload
#
# FILE PERMISSIONS - the other classic 403
#
# Nginx workers run as `www-data`; the releases are owned by `deploy`. Every directory from
# /srv down to the two `dist` folders needs the execute bit for whoever www-data is
# (`chmod o+x /srv /srv/silkgrain /srv/silkgrain/releases/*`, or put www-data in the deploy
# group and use g+rx). A missing traverse bit produces a 403 on every asset and nothing in the
# error log more helpful than "Permission denied".
# =========================================================================================


# -----------------------------------------------------------------------------------------
# The API. One process group, PM2 cluster mode, bound to loopback only.
#
# `127.0.0.1` and not `localhost`: the API listens on IPv4, `localhost` can resolve to `::1`
# first, and a proxy aimed at an address nothing listens on hangs for the connect timeout
# rather than failing fast. The two Vite configs make the same choice for the same reason.
#
# `keepalive` needs `proxy_http_version 1.1` and a cleared `Connection` header, both set at
# server level below. Without them every proxied request opens and closes a TCP connection,
# which on a checkout page is a measurable amount of nothing.
# -----------------------------------------------------------------------------------------
upstream silkgrain_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Combined, plus the two numbers an incident actually turns on: how long we took and how much
# of that was the API. `$upstream_response_time` empty means the request never reached Node -
# which distinguishes "the API is slow" from "the API is not there" without opening a second log.
log_format silkgrain '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time';

# Used by the hashed-asset and health-probe locations, which are the two kinds of request that
# would otherwise fill the log with noise. `access_log off` was the obvious answer and it is the
# wrong one twice over: the most common post-deploy failure is a cached index.html naming a chunk
# that was pruned with the old release, and its only symptom is a 404 under /assets/ - the exact
# line `off` would have thrown away. A readiness probe answering 503 is the same story. So the
# rule is silence on success and a line on everything else.
map $status $log_if_not_ok {
    ~^[23]  0;
    default 1;
}


# =========================================================================================
# :80 - ACME first, then everything else goes to HTTPS.
# =========================================================================================
server {
    listen 80;
    # Remove the IPv6 line on a host without IPv6: bind() fails with EAFNOSUPPORT and Nginx
    # will not start at all, rather than starting without v6.
    listen [::]:80;

    server_name silkgrain.com www.silkgrain.com;

    access_log /var/log/nginx/silkgrain.access.log silkgrain;
    error_log  /var/log/nginx/silkgrain.error.log;

    # BEFORE the redirect, and `^~` so no regex location can take it away. Let's Encrypt does
    # follow a 301, so this would probably survive being placed after - "probably" is not a
    # property to give the thing that stops the certificate expiring at 90 days.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =========================================================================================
# :443 - www redirects to the apex.
#
# This is not tidiness. `absoluteUrl()` in apps/web/src/lib/seo.tsx builds every canonical,
# Open Graph URL and JSON-LD id from `window.location.origin`, so a site reachable at two
# origins emits two complete sets of canonical tags, each pointing at itself. One origin is
# the only configuration in which those tags mean anything.
#
# The certificate must cover both names for this block to load - see the certbot line above.
# If no `www` DNS record is ever created this block is dead config and costs nothing.
# =========================================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.silkgrain.com;

    ssl_certificate     /etc/letsencrypt/live/silkgrain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silkgrain.com/privkey.pem;

    access_log /var/log/nginx/silkgrain.access.log silkgrain;
    error_log  /var/log/nginx/silkgrain.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://silkgrain.com$request_uri;
    }
}


# =========================================================================================
# :443 - the site.
# =========================================================================================
server {
    # `listen ... http2` and not the newer `http2 on;` directive. Ubuntu 24.04 ships Nginx
    # 1.24.0; `http2 on;` arrived in 1.25.1 and on 1.24 it is an unknown directive, so the
    # config fails to load entirely. If this host is ever moved to nginx.org's mainline
    # packages, switch to `http2 on;` - 1.25.1+ still accepts the listen flag but warns that
    # it is deprecated, and a warning on every reload is a warning nobody reads.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name silkgrain.com;

    access_log /var/log/nginx/silkgrain.access.log silkgrain;
    error_log  /var/log/nginx/silkgrain.error.log;

    # The storefront is the default document root; the back office overrides it with `alias`.
    root /srv/silkgrain/current/apps/web/dist;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------------------------------------------------------------------------------- TLS
    ssl_certificate     /etc/letsencrypt/live/silkgrain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silkgrain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # Mozilla's "intermediate" list, minus its DHE entries: those need an `ssl_dhparam` file
    # this deployment does not generate, and offering a suite without the parameters to
    # complete it is a handshake failure for whichever old client picks it.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SilkGrainTLS:10m;
    ssl_session_timeout 1d;
    # Tickets without rotation are a standing hole in forward secrecy: one key, held in memory
    # for the life of the process, decrypts every resumed session recorded while it lived.
    ssl_session_tickets off;

    # No OCSP stapling, deliberately. Let's Encrypt retired its OCSP responders and no longer
    # puts an OCSP URL in issued certificates, so `ssl_stapling on` would do nothing except
    # write "no OCSP responder URL in the certificate" into the error log on every reload -
    # a permanent warning that trains people to ignore the error log. Revocation for these
    # certificates is short lifetimes and CRLs, not stapling.

    # ------------------------------------------------------------------------------- bodies
    # 1 MB globally, because Fastify's own `bodyLimit` is 1 MB (apps/api/src/app.ts) and two
    # limits that disagree mean one of them is decoration. The single exception is the admin
    # image upload, further down, which raises it to 16m to sit just above the application's
    # own 12 MB cap.
    client_max_body_size 1m;
    client_body_timeout 30s;
    send_timeout 30s;

    # -------------------------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/html is always compressed and must not be listed. Everything here is a type this
    # build actually emits; a longer list is a longer list, not a faster site.
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Brotli, if the module is installed. The trailing `*` makes this a glob, and a glob that
    # matches nothing is not an error - which is the whole point: `brotli on;` written inline
    # would be an unknown directive on any box where libnginx-mod-brotli is absent, and the
    # config would refuse to load on the night somebody rebuilt the VPS. Create the file with:
    #
    #   sudo apt-get install -y libnginx-mod-brotli
    #   sudo tee /etc/nginx/snippets/silkgrain-brotli.conf >/dev/null <<'EOF'
    #   brotli on;
    #   brotli_comp_level 5;
    #   brotli_min_length 1024;
    #   brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    #   EOF
    #
    # gzip stays on regardless: it is the floor every client and every intermediary supports,
    # and it is what scripts/bundle-budget.mjs measures the bundle against.
    include /etc/nginx/snippets/silkgrain-brotli.conf*;

    # --------------------------------------------------------------------- proxy, in one place
    #
    # These are set at server level and inherited by every `location` that proxies, so the
    # X-Forwarded-For line below exists exactly once.
    #
    # BEWARE: `proxy_set_header` inherits the same way `add_header` does - a location that
    # declares even one `proxy_set_header` of its own silently discards ALL of these. If you
    # ever need a per-location header, restate the whole block there.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    #
    # LOAD-BEARING. apps/api/src/app.ts sets `trustProxy: 1` (decision D-39) - a hop count, not
    # `true`. One hop means Fastify takes the address THIS proxy appended to the right-hand end
    # of X-Forwarded-For and ignores everything the client wrote to the left of it, so every
    # rate limiter in plugins/security.ts keys on the real client rather than on a header the
    # attacker controls. Two consequences, both of which bite silently:
    #
    #   * `$proxy_add_x_forwarded_for` and not a bare `$remote_addr`. Fastify counts from the
    #     right; giving it a single-entry header still works, but the moment anything else is
    #     added to the chain the semantics diverge from what app.ts documents.
    #   * If a CDN or a second proxy is ever put in front of this box, the hop count in
    #     app.ts MUST go to 2 in the same change. Until it does, `request.ip` is the CDN's
    #     forwarded value's neighbour, every limiter buckets on it, and the ten-per-fifteen-
    #     minutes on admin sign-in - the back office's only online-guessing defence - stops
    #     limiting anything. Nothing fails; it just stops working.
    # The request id, ours rather than the caller's. `apps/api/src/app.ts` sets
    # `requestIdHeader: 'x-request-id'`, so its `genReqId` only runs when the header is
    # ABSENT - without this line any client picks the id that labels every log line for its
    # request and that the error handler echoes back, which is both a way to pin one id
    # across an attack and a way to make every log line as long as the header. $request_id
    # is nginx's own, so this also joins the access log to the API log for free.
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # The API sets its own Location headers from PUBLIC_WEB_URL; nothing should be rewritten
    # on the way out.
    proxy_redirect off;

    # ---------------------------------------------------------------------------- ACME again
    # Also on 443, because Let's Encrypt follows the :80 redirect and a renewal that arrives
    # here must not be answered with the storefront's index.html.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------- source maps
    # Both Vite builds set `sourcemap: true`, so every release directory contains a .map file
    # beside every chunk - including the back office's, which is a complete, readable listing
    # of every admin route, permission check and payload shape. Sentry (task 9.6) uploads maps
    # at build time through its own CLI; it never fetches them from the site. So there is no
    # reader for these but somebody mapping the attack surface.
    #
    # First regex in the file, so it is checked first among the regexes. It covers /assets/
    # and /admin/assets/ in one rule, which is why it is not written as a `deny` inside each.
    #
    # Logged normally rather than silenced: a browser with devtools open asks for a handful of
    # these and a scanner asks for all of them, and the difference is only visible in the log.
    location ~ \.map$ {
        return 404;
    }

    # --------------------------------------------------------------- admin image upload only
    # POST /api/admin/products/:id/images is multipart. The application caps the decoded image
    # at 12 MB in two places that already agree - `MAX_INPUT_BYTES` in
    # apps/api/src/modules/media/image.service.ts and the `fileSize` limit on @fastify/multipart
    # in admin.routes.ts - and 16m here sits above both on purpose. Setting it AT 12m would mean
    # a 12.1 MB photograph is answered by Nginx's own HTML 413 page instead of the application's
    # "That image is over 12 MB; please resize it first", and the operator would be debugging
    # the wrong layer. The headroom absorbs the multipart envelope and the boundary.
    #
    # A regex location, so it is matched before the `/api/` prefix below. `[0-9]+` and not `.*`:
    # the id is numeric (`PathId` in contracts), and a loose pattern would hand a 16 MB body
    # limit to any path somebody later hangs off /api/admin/products/.
    location ~ ^/api/admin/products/[0-9]+/images$ {
        client_max_body_size 16m;
        proxy_pass http://silkgrain_api;
    }

    # ----------------------------------------------------------------------- Stripe webhook
    # The signature is an HMAC over the exact bytes Stripe sent (stripe.webhook.ts registers a
    # raw-body content-type parser scoped to this route alone). Nothing here may rewrite the
    # path or touch the body.
    #
    # Honestly: Nginx does not modify request bodies whether it buffers them or not, so the
    # signature would survive the generic /api/ block too. What this location actually buys is
    # (a) a named place that says "do not add a body-altering directive to /api/ without
    # thinking about this route", and (b) not spooling a redelivery storm through
    # /var/lib/nginx/body - after an outage Stripe retries hard, and the handler answers 200 on
    # a duplicate event id without reading anything.
    #
    # An exact match, so it wins over both the regex above and the /api/ prefix below. The body
    # limit stays at the server's 1m, which matches Fastify's own bodyLimit; Stripe events are
    # a few kilobytes.
    location = /api/webhooks/stripe {
        proxy_pass http://silkgrain_api;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ------------------------------------------------------------------------------ the API
    # No trailing slash on `proxy_pass`. `http://silkgrain_api;` passes the URI through
    # unchanged, so /api/products arrives at Fastify as /api/products. Writing
    # `http://silkgrain_api/;` would strip the /api/ prefix and every route would 404.
    location /api/ {
        proxy_pass http://silkgrain_api;
    }

    # --------------------------------------------------------------------- product images
    # The object store is MinIO on this same box, bound to loopback, and its bucket is served
    # from the shop's own origin rather than from media.silkgrain.com. That is decision D-52,
    # and it is why `S3_PUBLIC_URL=https://silkgrain.com/media` in shared/.env. A subdomain
    # would need its own A record, its own name on the certificate and its own server block;
    # this needs none of the three, and it lets the CSP below name no external host at all -
    # `img-src 'self'` covers every product photograph.
    #
    # The URI on `proxy_pass` is load-bearing and it is the bucket name. Nginx replaces the
    # matched prefix with it, so /media/products/<hash>.webp is fetched from MinIO as
    # /silkgrain-media/products/<hash>.webp. That is path-style addressing, which is why
    # S3_FORCE_PATH_STYLE=true in the same file. Renaming S3_BUCKET means editing this line in
    # the same commit; a mismatch is a 404 on every image and no other symptom.
    #
    # Reads only. The bucket is anonymous-read by the policy the API writes itself
    # (`Storage.provision`), and the credentials that can write it never leave the API process.
    # `limit_except` makes that structural rather than a property of how MinIO evaluates that
    # policy: nothing but GET and HEAD reaches the object store through Nginx.
    #
    # No Cache-Control here on purpose. The API sets `public, max-age=31536000, immutable` on
    # the object at upload time and MinIO returns it, so adding one here would put a second,
    # competing Cache-Control beside it - `add_header` adds, it does not replace what the
    # upstream sent. The object's own header is the one contract.
    #
    # Nothing here inherits a `proxy_set_header`, deliberately: this block declares none, so it
    # takes the server-level set above unchanged. Adding even one line here would silently
    # discard all of them, X-Forwarded-For included.
    #
    # Moving the images to a CDN later is three lines and no code: point S3_PUBLIC_URL at it,
    # put its origin back into `img-src` in both CSP headers below, and delete this block.
    location ^~ /media/ {
        limit_except GET HEAD {
            deny all;
        }

        # The query string is dropped before the request reaches MinIO, and this is not tidiness.
        # S3 lets a GET override the response headers it will be answered with, and MinIO honours
        # it for anonymous reads: `?response-content-type=text/html` on an object URL comes back
        # 200 with `Content-Type: text/html`, from this origin. Nothing exploitable follows today,
        # because every stored byte is sharp's own webp output (`processImage` hard-codes the type
        # and the key is the sha256 of the encoder's output), so what a browser would parse as
        # HTML is a VP8 bitstream - measured, not assumed. But the parameter is worth nothing to
        # this application and worth something to an attacker, and the same clearing takes the
        # bucket's other query APIs off the proxy with it.
        set $args '';
        proxy_pass http://127.0.0.1:9000/silkgrain-media/;

        # LOAD-BEARING, and the opposite of the Cache-Control reasoning above. MinIO sets its own
        # `Strict-Transport-Security: max-age=31536000` on object responses, and nginx's default
        # `proxy_hide_header` list covers only Date, Server, X-Pad and X-Accel-*. So without this
        # line the browser receives two HSTS headers on every product image - MinIO's first,
        # because `add_header` appends after the upstream's - and RFC 6797 section 8.1 says a UA
        # processes only the first. Every image load would then rewrite this origin's HSTS entry
        # from the two years the rest of the site sends down to MinIO's one. A security header is
        # not a place to let the upstream win by arriving first.
        proxy_hide_header Strict-Transport-Security;

        # Same rule, smaller stake. MinIO sends `X-Content-Type-Options: nosniff` of its own, and
        # measured on the live box the browser received it twice. Two identical values cannot
        # disagree, so nothing was broken - but which value this origin sends is not the object
        # store's decision to make, and the day MinIO sends something else is not the day to find
        # that out.
        proxy_hide_header X-Content-Type-Options;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # ---------------------------------------------------------------------------- the probes
    # `/health` and `/ready` are registered at the API root, NOT under /api (healthRoutes is
    # registered without a prefix in app.ts). Without these two exact locations they would fall
    # through to the SPA and return the storefront's index.html with status 200 - an uptime
    # monitor would report the shop healthy through a total database outage, which is precisely
    # the failure it was bought to catch.
    #
    # Public and unauthenticated on purpose. Decision D-40 took the driver's error text off the
    # wire - /ready reports only whether each dependency answered and how long it took - so
    # there is nothing here worth hiding, and an external monitor cannot hold a credential.
    #
    # /ready answers 503 when degraded. `proxy_intercept_errors` is left off (the default) so
    # that 503 and its JSON body reach the monitor instead of an Nginx error page.
    location = /health {
        access_log /var/log/nginx/silkgrain.access.log silkgrain if=$log_if_not_ok;
        proxy_pass http://silkgrain_api;
    }

    location = /ready {
        access_log /var/log/nginx/silkgrain.access.log silkgrain if=$log_if_not_ok;
        proxy_pass http://silkgrain_api;
    }

    # --------------------------------------------------------------------------- sitemap.xml
    # apps/web/public/robots.txt advertises https://silkgrain.com/sitemap.xml and nothing
    # generates one. Without this block the SPA fallback answers that URL with index.html and
    # status 200, so a crawler asking for XML is handed HTML and told it succeeded. A 404 is
    # the true answer. Delete this block on the day a sitemap is generated - and if the
    # decision is that there will not be one, delete the `Sitemap:` line from robots.txt
    # instead, because a config comment is not where that belongs.
    location = /sitemap.xml {
        return 404;
    }

    # ------------------------------------------------------------------ back office: assets
    # Longest matching prefix wins, so this beats `/admin/` below. Same hashed-filename contract
    # as the storefront's assets, and the same one-year immutable answer.
    #
    # No `try_files` here on purpose: the static handler already answers 404 for a file that is
    # not there, and `try_files` combined with `alias` is the one construction in this file with
    # a history of surprising people. It is used below only where the SPA fallback needs it.
    location /admin/assets/ {
        alias /srv/silkgrain/current/apps/admin/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        access_log /var/log/nginx/silkgrain.access.log silkgrain if=$log_if_not_ok;
    }

    # ------------------------------------------------------------- back office: the document
    # The security headers live here and in `= /index.html`, and nowhere else. See the long
    # comment on the storefront's copy below for why they are not at server level.
    location = /admin/index.html {
        alias /srv/silkgrain/current/apps/admin/dist/index.html;

        # `no-cache` means "you may keep it, but revalidate before you use it" - not "do not
        # store it". That is exactly right for this file: it names the hashed chunks, so a copy
        # cached without revalidation pins a visitor to one release forever, while a
        # revalidation costs one conditional request that Nginx answers 304 from the ETag.
        add_header Cache-Control "no-cache" always;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # The document already carries <meta name="robots" content="noindex, nofollow">, but a
        # meta tag is only read by something that parses the HTML. The header is read by
        # everything, including whatever indexes a .js chunk it found in a referrer log.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ------------------------------------------------------------ back office: SPA fallback
    # No `^~`. That is deliberate: without it, the `\.map$` regex above is still consulted for
    # /admin/... paths, which is how one rule covers both builds.
    #
    # `alias` plus `try_files` in a plain prefix location (no regex captures) resolves /admin/foo
    # to <dist>/foo; the fallback is a literal URI, so it re-enters location matching and lands
    # on the exact `= /admin/index.html` above, which is what puts the security headers on it.
    # A request for `/admin/` itself matches the directory, `index index.html` runs and
    # internally redirects to /admin/index.html - the same destination.
    #
    # The old warning about `alias` and `try_files` (nginx trac #97) is about regex locations
    # with captures, and the prefix case was fixed long before the 1.24.0 that Ubuntu 24.04
    # ships. It is still the one construction here worth confirming by hand rather than by
    # reading: on the clean-machine run, `curl -sI https://silkgrain.com/admin/orders/1`
    # must return 200 with `content-security-policy` present, not 404.
    location /admin/ {
        alias /srv/silkgrain/current/apps/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # `/admin` with no trailing slash does not match `location /admin/`; it would fall into the
    # storefront's `location /`, be answered with the storefront's index.html, and the customer
    # router would render the shop's 404 at an admin URL. The Vite base is `/admin/`, so the
    # slash is part of the app's identity, not cosmetic.
    location = /admin {
        return 301 /admin/;
    }

    # ------------------------------------------------------------------ storefront: assets
    # Every filename Vite emits under /assets/ carries a content hash - chunks, CSS and the
    # woff2 faces the index preloads - so the bytes at a given URL never change and a year is
    # not a guess. `immutable` additionally stops a revalidation on reload.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # Quiet on 200 and 304, loud on 404 - see the `map` above. `=404` rather than falling
        # through to the SPA: a missing chunk must not be answered with an HTML document, which
        # the browser would then try to execute as JavaScript.
        access_log /var/log/nginx/silkgrain.access.log silkgrain if=$log_if_not_ok;
        try_files $uri =404;
    }

    # -------------------------------------------------------------- storefront: the document
    #
    # WHY THE SECURITY HEADERS ARE HERE AND NOT AT SERVER LEVEL
    #
    # `add_header` inherits only when the current level declares none of its own. The asset
    # locations above must declare Cache-Control, so anything set at server level would be
    # dropped there - and, worse, in `location /api/`, where it would land on top of the strict
    # policy @fastify/helmet already sets (plugins/security.ts: `default-src 'none'`). Two
    # Content-Security-Policy headers on one response are intersected by the browser, which
    # means the API's effective policy would silently become a function of this file. Keeping
    # these headers in the two document locations leaves the API's own headers untouched and
    # makes the set that reaches a browser readable in one place per app.
    #
    # This is the one duplication in the file. If the two blocks ever diverge, the difference
    # must be commented - today the only difference is the admin's X-Robots-Tag.
    #
    # These two locations are the ONLY way an HTML document leaves this server: /index.html is
    # matched exactly, and every other path either resolves to a real file (robots.txt) or is
    # rewritten to /index.html by the fallback below, which re-enters location matching.
    location = /index.html {
        # See the note on the admin document above: `no-cache` is revalidate-before-use, not
        # do-not-store, and this file names the hashed chunks - a copy served without
        # revalidation pins a visitor to one release forever.
        add_header Cache-Control "no-cache" always;

        # Content-Security-Policy, directive by directive. A policy nobody can explain is a
        # policy the next person widens to `*`, so each line below says what it is protecting
        # and what forced it to be as loose as it is.
        #
        #   default-src 'self'      - the floor. Everything not named below falls back to it,
        #                             so a directive added to the app by accident (a worker, a
        #                             manifest, a media element) is same-origin or refused.
        #   base-uri 'self'         - a <base> tag injected into the DOM can repoint every
        #                             relative script URL at another host; this makes that
        #                             injection useless.
        #   form-action 'self'      - the wholesale and contact forms post to this origin. An
        #                             injected form cannot exfiltrate to somebody else's.
        #   frame-ancestors 'none'  - nothing may frame the shop or the back office. This
        #                             supersedes X-Frame-Options in every browser that
        #                             implements CSP2, which is all of them, so the older
        #                             header is deliberately absent rather than duplicated.
        #   object-src 'none'       - no <object>, <embed>, no plugin content, ever.
        #   script-src 'self'       - achievable, and worth guarding. Vite emits external
        #                             modules only; there is not one inline <script> in either
        #                             build (`apps/*/dist/index.html` is a link, a script tag
        #                             with src, and five font preloads). If somebody adds an
        #                             inline analytics snippet, this line breaks it - that is
        #                             the point. Give it a nonce or a hash, do not add
        #                             'unsafe-inline'.
        #   style-src 'unsafe-inline' - REQUIRED, and not laziness. Eight places in
        #                             apps/web/src set a `style={{...}}` attribute for a value
        #                             only the runtime knows: the hero's parallax transform and
        #                             the featured slider's per-product tone (home.page.tsx,
        #                             FeaturedSlider.tsx), the review histogram bars
        #                             (ReviewsPanel.tsx), the free-shipping meter
        #                             (FreeShippingMeter.tsx), the price-range slider track
        #                             (PriceRange.tsx) and the wholesale hero. An inline style
        #                             ATTRIBUTE - not just a <style> block - is blocked by
        #                             style-src without this, and the failure is silent and
        #                             visual: every progress bar renders at zero width. The
        #                             way out is CSS custom properties set from JS, which is a
        #                             refactor of eight components, not a config change.
        #   img-src                 - 'self' for anything bundled; `data:` because a data URI
        #                             image is inert and the alternative is a policy that
        #                             breaks the first time somebody inlines an SVG (the built
        #                             CSS contains none today). 'self' also covers every
        #                             product photograph: D-52 serves the bucket from this
        #                             origin under /media/, so no external host is named here
        #                             at all. A CDN later means putting its origin back into
        #                             both copies of this header, in the same commit that
        #                             changes S3_PUBLIC_URL. The development seed's fixture
        #                             hosts - wikimedia
        #                             and themealdb - are deliberately NOT here: they reach
        #                             product_images only through `pnpm db:seed`, which refuses
        #                             NODE_ENV=production (D-38) and appears in no deploy path,
        #                             so in production they would be three origins nothing can
        #                             legitimately load and an injected <img src> could still
        #                             use to send data out. If a fixture image ever does show
        #                             up on the live site, the broken image is the correct
        #                             outcome and the fix is to upload a real photograph.
        #   font-src 'self'         - @fontsource is bundled into /assets. No Google Fonts.
        #   connect-src 'self'      - the API is proxied at /api on this same origin, so 'self'
        #                             IS the API origin. If the API is ever moved to
        #                             api.silkgrain.com, this line and CORS_ORIGINS in
        #                             /srv/silkgrain/shared/.env change together or the shop
        #                             stops loading.
        #   upgrade-insecure-requests - a net under a subresource URL that got saved as http://.
        #
        # NOT HERE YET, and each will be needed the day its feature lands:
        #   * Stripe (tasks 4.2 / 6.x, blocked on a key by decision D-27) needs
        #     `script-src https://js.stripe.com`, `frame-src https://js.stripe.com
        #     https://hooks.stripe.com` and `connect-src https://api.stripe.com`. The Payment
        #     Element does not degrade when the CSP blocks it; it simply never mounts.
        #   * Sentry (task 9.6) needs its ingest host in `connect-src`.
        #   * Apple Pay / Google Pay through the Payment Element need `payment=(self
        #     "https://js.stripe.com")` in Permissions-Policy below, which today reads
        #     `payment=()`.
        # There is no `report-uri`/`report-to`: nothing collects reports, and a report
        # destination that discards them is worse than none because it looks like monitoring.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Every feature this app does not use, switched off, so a third-party script that
        # arrives later cannot quietly turn one on. `payment=()` is correct TODAY and must
        # change with the Stripe work - see the note above.
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

        # Two years, subdomains included, and flagged for the preload list.
        #
        # `preload` is a one-way door and should be read as one: submitting the domain at
        # hstspreload.org bakes it into browser binaries, it commits EVERY subdomain -
        # including anything on a staging box that has only ever spoken HTTP - to HTTPS, and
        # removal takes months to reach released browsers. The header is safe to send now; do
        # not submit the domain until every subdomain that will ever exist has a certificate.
        # The API sets its own HSTS as well (plugins/security.ts, one year, no preload); these
        # never land on the same response, because /api/ does not inherit this block.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # ------------------------------------------------------------ storefront: SPA fallback
    #
    # THE 404 PROBLEM, STATED HONESTLY
    #
    # `try_files ... /index.html` answers an unknown path with **200 OK** and the storefront's
    # own designed 404 page. STATE.md has been carrying "the status code is still 200 until
    # Nginx answers 404, which is Phase 9". Phase 9 cannot fix it, and this comment exists so
    # that sentence is not repeated for a fourth phase.
    #
    # Nginx cannot fix it because Nginx does not know which client-side routes exist. The route
    # table is inside the JavaScript bundle, and it is partly data: /product/$slug and
    # /shop/c/$slug resolve against the catalogue, so "does this URL exist" is a database
    # question that changes whenever an editor publishes or unpublishes a product. Any rule
    # written here is a guess - `try_files ... =404` would 404 every real route, and a
    # hand-maintained prefix allow-list would be a second copy of the router that goes stale
    # the first time somebody adds a page.
    #
    # What would actually fix it, in increasing order of cost:
    #
    #   1. Prerender a route manifest at build time - emit one directory with an index.html per
    #      known route (including one per published slug, regenerated on deploy and whenever
    #      the catalogue changes), plus a real 404.html, and serve
    #      `try_files $uri $uri/index.html /404.html;` with `error_page 404 /404.html;`. This
    #      trades the wrong status code for a deploy that depends on database content.
    #   2. An SSR or edge-render pass in front of the SPA, which knows the router and can set
    #      the status the router decided on. This is the only complete answer, and it is an
    #      architecture decision, not a task in PLAN.md.
    #
    # Until one of those happens, the cost is bounded and worth stating: search engines detect
    # a soft 404 by content and generally decline to index the page anyway, so the damage is to
    # monitoring and to correctness rather than to ranking, and the Playwright check that
    # asserts "a real 404 in the shop's own words" is testing the copy, not the status line.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing in either dist directory is a dotfile, so this is purely defensive against a
    # future release layout. It is placed after the ACME locations, which use `^~` and are
    # therefore chosen before any regex is considered - otherwise this rule would deny the
    # challenge and the certificate would expire at 90 days with no other symptom.
    location ~ /\. {
        deny all;
    }
}
