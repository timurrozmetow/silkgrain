<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ open }}" style="display:flex;flex-direction:column;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;background:#fff;border:1px solid #EEEDE6;border-radius:22px;padding:13px;transition:transform .32s cubic-bezier(.22,1,.36,1),box-shadow .32s ease,border-color .32s ease;height:100%;" style-hover="transform:translateY(-5px);box-shadow:0 18px 42px rgba(20,22,15,0.11);border-color:#E2E0D6;">
  <div style="position:relative;aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:#F4F2EB;">
    <img src="{{ img }}" alt="{{ name }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.22,1,.36,1);" style-hover="transform:scale(1.06);" />
    <div style="position:absolute;top:11px;left:11px;display:flex;gap:6px;">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="0"><span style="font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#fff;background:{{ b.bg }};padding:4px 10px;border-radius:999px;">{{ b.label }}</span></sc-for>
    </div>
    <button onClick="{{ noop }}" style="position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.92);color:#6F6D63;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;" style-hover="color:#C42E6B;background:#fff;"><i class="ph ph-heart" style="font-size:16px;"></i></button>
  </div>
  <div style="padding:15px 6px 8px;display:flex;flex-direction:column;gap:9px;position:relative;">
    <button onClick="{{ noop }}" style="position:absolute;top:-37px;right:5px;width:46px;height:46px;border-radius:50%;border:none;background:{{ accent }};color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 18px rgba(20,22,15,0.18);transition:transform .25s cubic-bezier(.34,1.56,.64,1);" style-hover="transform:scale(1.12) rotate(90deg);"><i class="ph-bold ph-plus" style="font-size:18px;"></i></button>
    <div style="display:flex;align-items:center;gap:7px;"><span style="width:7px;height:7px;border-radius:50%;background:{{ accent }};"></span><span style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9A988D;">{{ cat }}</span></div>
    <h3 style="margin:0;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:17px;line-height:1.25;color:#16160F;">{{ name }}</h3>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:2px;">
      <span style="font-size:17px;font-weight:700;color:#16160F;">{{ price }}</span>
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:#9A988D;"><i class="ph-fill ph-star" style="font-size:12px;color:#F5B11E;"></i>{{ rating }} · {{ reviews }}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:290,&quot;height&quot;:360},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(slug:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const DEMO={slug:'demo',name:'Uzbek Devzira Rice',cat:'Rice & Grains',catKey:'rice',rating:4.9,reviews:142,badges:['Bestseller'],img:'https://commons.wikimedia.org/wiki/Special:FilePath/Rice%20grains%20(IRRI).jpg?width=600',weights:[{label:'2 lb',price:14.99}]};
    const p=this.props.product||DEMO;
    const catColor={rice:'#F5B11E',lentils:'#12A05A',fruits:'#C42E6B',spices:'#FF5A1E',flour:'#3A6FF7',mixes:'#0FA39A'};
    const accent=catColor[p.catKey]||'#FF5A1E';
    const badgeBg={Bestseller:'#16160F',New:'#12A05A',Organic:'#12A05A',Premium:'#C42E6B',Sale:'#FF5A1E'};
    const badges=(p.badges||[]).slice(0,1).map(b=>({label:b,bg:badgeBg[b]||'#16160F'}));
    const price='$'+Number(p.weights&&p.weights[0]?p.weights[0].price:(p.price||0)).toFixed(2);
    return {
      open:()=>{ if(this.props.onOpen) this.props.onOpen(p.slug); },
      noop:(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); },
      img:p.img||'', name:p.name, cat:p.cat, accent, badges, price,
      rating:(p.rating||0).toFixed(1), reviews:p.reviews||0,
    };
  }
}
</script>
</body>
</html>
